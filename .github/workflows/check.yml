name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Used only to install golangci-lint (`run --help` exits 0 without linting);
      # `make check` below is the single definition of "check".
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
          args: --help
      - run: make check
