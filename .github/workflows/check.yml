name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Installs golangci-lint only; `make check` below is the single definition of "check".
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
          args: --version
      - run: make check
